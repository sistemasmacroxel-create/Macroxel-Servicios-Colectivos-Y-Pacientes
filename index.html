  if(off&&el.classList.contains(off)===!!ok)el.classList.toggle(off,!ok);

     if(row && /id[^<]{0,40}dispositivo|device\s*id/i.test(row.textContent||'')) row.style.setProperty('display','none','important');
   }
   document.querySelectorAll('.mx-login-row').forEach(row=>{if(/id[^<]{0,40}dispositivo/i.test(row.textContent||''))row.style.setProperty('display','none','important')});
   document.querySelectorAll('#mxViewerActivationGate label,#activationGate label,#mxVaGate label').forEach(l=>{
     if(/id[^<]{0,40}dispositivo|device\s*id/i.test(l.textContent||'')){const row=l.closest('.field,.mx-va-idline,.mx-login-row');if(row)row.style.setProperty('display','none','important')}
   });
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',clean,{once:true});else clean();
 new MutationObserver(clean).observe(document.documentElement,{subtree:true,childList:true});
})();
</script>
