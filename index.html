<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MACROXEL Surtido Colectivos v1.0.0</title>
<style>
:root{--navy:#0b365f;--blue:#0f5c9b;--line:#dbe5f1;--muted:#64748b;--ok:#15803d;--bad:#b91c1c;--warn:#b45309}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f3f7fb;color:#10243a}.hidden{display:none!important}.app{max-width:1080px;margin:auto;padding:10px 10px 80px}.top{position:sticky;top:0;z-index:20;background:rgba(243,247,251,.96);backdrop-filter:blur(10px);padding:8px 0}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:18px;padding:10px 12px;box-shadow:0 10px 25px rgba(10,52,93,.18)}.brand{display:flex;align-items:center;gap:9px;min-width:0}.brand img{width:42px;height:42px;object-fit:contain;border-radius:10px;background:#fff}.brand h1{font-size:16px;margin:0}.brand small{display:block;opacity:.82;font-size:10px}.session{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}.dot{width:10px;height:10px;border-radius:50%;background:#f59e0b;box-shadow:0 0 0 4px rgba(255,255,255,.16)}.dot.ok{background:#22c55e}.dot.bad{background:#ef4444}.user{font-size:10px;font-weight:800}.btn{border:0;border-radius:11px;padding:9px 12px;font-weight:800;cursor:pointer;background:#e7eef7;color:#173a5b}.btn.ok{background:#15803d;color:#fff}.btn.bad{background:#b91c1c;color:#fff}.btn.secondary{background:#fff;color:#153b60;border:1px solid var(--line)}.btn:disabled{opacity:.55;cursor:not-allowed}.conn{font-size:8px;line-height:1.25;color:#475569;margin:5px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;margin:8px 0}.input,.select{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:11px 12px;background:#fff;color:#10243a;font-size:14px}.status{padding:8px 10px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:11px;color:#475569;margin-bottom:8px}.orders{display:grid;gap:9px}.order{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 5px 16px rgba(15,39,69,.05)}.order[open]{border-color:#8fb8dc}.order summary{list-style:none;cursor:pointer;padding:12px}.order summary::-webkit-details-marker{display:none}.order-head{display:grid;grid-template-columns:1fr auto;gap:8px}.folio{font-size:16px;font-weight:950;color:var(--navy)}.meta{font-size:11px;color:#475569;margin-top:4px;line-height:1.4}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:9px;font-weight:900;align-self:start}.badge.pending{background:#eff6ff;color:#1d4ed8}.badge.claimed{background:#fff7ed;color:#c2410c}.badge.submitted{background:#fef9c3;color:#854d0e}.badge.applied{background:#dcfce7;color:#166534}.badge.error{background:#fee2e2;color:#b91c1c}.body{border-top:1px solid var(--line);padding:10px}.patient{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;background:#f8fafc;border-radius:12px;padding:9px;margin-bottom:9px}.patient div{font-size:10px}.patient b{display:block;font-size:12px;color:#173a5b}.item{border:1px solid var(--line);border-radius:13px;padding:10px;margin:8px 0}.item-title{font-weight:900;color:#143f67;font-size:13px}.item-sub{font-size:10px;color:#64748b;margin-top:3px}.coverage{font-size:10px;font-weight:900;padding:6px 8px;border-radius:9px;margin-top:7px}.coverage.ok{background:#dcfce7;color:#166534}.coverage.warn{background:#ffedd5;color:#9a3412}.coverage.bad{background:#fee2e2;color:#b91c1c}.item-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.field label{display:block;font-size:9px;font-weight:900;color:#475569;margin:0 0 3px}.field .input,.field .select{padding:9px;font-size:13px}.field.full{grid-column:1/-1}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}.empty{padding:35px 10px;text-align:center;color:#64748b;background:#fff;border:1px solid var(--line);border-radius:15px}.overlay{position:fixed;inset:0;background:rgba(15,23,42,.52);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}.gate{width:min(440px,100%);background:#fff;border-radius:20px;padding:17px;box-shadow:0 24px 60px rgba(0,0,0,.25)}.gate-brand{display:flex;align-items:center;gap:10px;margin-bottom:10px}.gate-brand img{width:55px;height:55px;object-fit:contain}.gate h2{margin:0;color:var(--navy);font-size:19px}.gate p{font-size:12px;color:#64748b;line-height:1.45}.gate .field{margin:8px 0}.gate-msg{font-size:11px;padding:8px 10px;border-radius:10px;background:#f1f5f9;margin:8px 0}.gate-msg.bad{background:#fee2e2;color:#991b1b}.gate-msg.ok{background:#dcfce7;color:#166534}.spin{display:inline-block;width:15px;height:15px;border:2px solid #cbd5e1;border-top-color:#2563eb;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:680px){.app{padding:6px 6px 75px}.head{border-radius:14px}.brand h1{font-size:14px}.brand small{display:none}.toolbar{grid-template-columns:1fr}.item-grid{grid-template-columns:1fr 1fr}.patient{grid-template-columns:1fr}.actions .btn{flex:1 1 145px}.conn{font-size:7px}}
</style>
